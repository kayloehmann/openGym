when:
  - event: [push, pull_request, manual]

steps:
  frontend:
    image: node:22-bookworm-slim
    commands:
      - cd frontend
      # The web build does not need native install scripts (notably sharp's
      # libvips download, which can time out on the NAS runner).
      - npm ci --ignore-scripts
      - npm test
      - node scripts/check-locales.mjs
      - npm run build
